<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSC418 Local CI Reports</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#f2f5f4;color:#233e34;margin:0;padding:35px 5%}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:27px;margin:0 0 7px}header p{margin:0;color:#7a8980;font-size:13px}.online{background:#e2f1e7;color:#28673e;padding:9px 16px;border-radius:20px;font-size:12px}.panel{background:white;border:1px solid #dbe5de;border-radius:12px;padding:24px;margin:18px 0}label{font-size:12px;font-weight:600}select{padding:9px;width:420px;max-width:100%;margin:0 15px;border:1px solid #d5e1d8;border-radius:6px}a{color:#267254;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#f7faf7;border:1px solid #e5ece5;padding:18px;border-radius:8px}.stat small{display:block;color:#7c8d7f;font-size:11px;margin-bottom:9px}.stat b{font-size:25px}.passed{color:#26804b}.failed{color:#be493e}.metadata{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px}.metadata span{display:block;font-size:10px;color:#8b9a8d;margin-bottom:5px}.metadata div{overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#7d8d7f;font-size:10px;letter-spacing:1px}td,th{padding:13px 8px;border-bottom:1px solid #e7eee8}td:first-child{width:50px}.failure{white-space:pre-wrap;font:11px Consolas,monospace;background:#fff1ef;padding:13px;color:#9d433c}footer{font-size:11px;color:#91a194}h2{font-size:16px;margin:0 0 18px}
</style></head><body><header><div><h1>Local CI report receiver</h1><p>CSC418 DevOps Lab Midterm · Reports received automatically on this computer</p></div><span class="online">● Receiver online</span></header><div class="panel"><label for="history">Saved report</label><select id="history"><option value="">Latest test-report.json</option></select><a id="raw" href="/latest">Open original JSON</a></div><div class="panel stats" id="stats"></div><div class="panel metadata" id="metadata"></div><div class="panel"><h2>Executed test results</h2><table><thead><tr><th>NO.</th><th>TEST NAME</th><th>RESULT</th></tr></thead><tbody id="tests"></tbody></table></div><footer>Source: test-report.json and report-history/ · No manual report download or copy is used.</footer><script>
const select=document.querySelector('#history');
async function load(){const file=select.value;const url=file?'/report?file='+encodeURIComponent(file):'/latest';document.querySelector('#raw').href=url;const r=await (await fetch(url)).json();const stats=document.querySelector('#stats');stats.replaceChildren();for(const [name,value] of Object.entries({Status:r.overall_status.toUpperCase(),Total:r.total,Passed:r.passed,Failed:r.failed})){const div=document.createElement('div');div.className='stat';const small=document.createElement('small');small.textContent=name;const b=document.createElement('b');b.textContent=value;b.className=name==='Status'?r.overall_status:'';div.append(small,b);stats.append(div);}const meta=document.querySelector('#metadata');meta.replaceChildren();for(const [name,value] of Object.entries({Repository:r.repository,Branch:r.branch,'Commit SHA':r.commit_sha,'Pipeline run ID':r.pipeline_run_id,'Executed at':r.execution_timestamp,'Received at':r.received_at})){const div=document.createElement('div');const label=document.createElement('span');label.textContent=name;div.append(label,document.createTextNode(value||'-'));meta.append(div);}const body=document.querySelector('#tests');body.replaceChildren();r.tests.forEach((t,i)=>{const tr=document.createElement('tr');for(const text of [i+1,t.name,t.result.toUpperCase()]){const td=document.createElement('td');td.textContent=text;tr.append(td);}tr.lastChild.className=t.result;body.append(tr);if(t.failure_message){const row=document.createElement('tr');const td=document.createElement('td');td.colSpan=3;const pre=document.createElement('div');pre.className='failure';pre.textContent=t.failure_message;td.append(pre);row.append(td);body.append(row);}});}
async function init(){const files=await(await fetch('/history')).json();for(const file of files.reverse()){const opt=document.createElement('option');opt.value=file;opt.textContent=file;select.append(opt);}await load();}select.addEventListener('change',load);init().catch(e=>{document.querySelector('#stats').textContent='Waiting for the first report: '+e.message;});
</script></body></html>
